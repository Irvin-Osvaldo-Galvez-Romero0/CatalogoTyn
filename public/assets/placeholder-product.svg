<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="400" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="396" height="396" rx="14" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Medical Cross & Orthotic Silhouette Shield -->
  <g transform="translate(140, 110)">
    <path d="M60 0 C90 0 120 18 120 60 C120 115 60 155 60 155 C60 155 0 115 0 60 C0 18 30 0 60 0 Z" fill="url(#primaryGrad)" opacity="0.9" />
    <!-- White Medical Cross -->
    <path d="M52 35 H68 V52 H85 V68 H68 V85 H52 V68 H35 V52 H52 Z" fill="#FFFFFF" />
  </g>

  <!-- Product Silhouette Lines -->
  <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="290" x2="280" y2="290" />
    <line x1="150" y1="310" x2="250" y2="310" />
  </g>

  <!-- Typography -->
  <text x="200" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="1">
    TYNOR ORTHOTICS
  </text>
  <text x="200" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">
    Dispositivo Ortopédico
  </text>
</svg>
